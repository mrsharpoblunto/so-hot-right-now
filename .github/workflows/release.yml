name: Release

# Push a tag such as v0.2.0 to publish. npm trusted publishing authenticates this workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or newer. The npm in a Node release can be older.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"
      # prepublishOnly runs the tests. npm adds the provenance statement.
      - run: npm publish
